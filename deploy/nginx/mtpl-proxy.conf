# ==============================================================================
# MTPL Shared Nginx Reverse Proxy Locations
# Included by HTTPS server blocks for both mishrikotkartravels.com and mtpl.online
# ==============================================================================

client_max_body_size 25M;
server_tokens off;

# Block hidden files (e.g. .env, .git) while allowing ACME verification
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# Sensitive endpoints: enquiries, callbacks, feedback, health, admin/auth
# Never cache in Nginx or shared proxies
location ~ ^/(api/(enquiries|enquiry|callbacks|callback|feedback|health|admin|auth)|admin|login) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    add_header Pragma "no-cache" always;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# All remaining API routes (e.g., /api/media/[key], /api/packages/[slug]/download)
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Preserve upstream Next.js ETag / Cache-Control headers without Nginx proxy caching
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

# Immutable Next.js build assets
location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# All public Next.js pages and static /assets/
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

