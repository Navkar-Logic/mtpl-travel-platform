# ==============================================================================
# MTPL Production Nginx Configuration (Hostinger VPS KVM 1 - Ubuntu)
# ==============================================================================
# Serves both domains independently with HTTP 200 (NO cross-domain redirects):
#   - mishrikotkartravels.com & www.mishrikotkartravels.com
#   - mtpl.online & www.mtpl.online
#
# Install paths on Ubuntu VPS:
#   /etc/nginx/snippets/mtpl-proxy.conf  <- copy deploy/nginx/mtpl-proxy.conf
#   /etc/nginx/sites-available/mtpl.conf <- copy deploy/nginx/mtpl.conf
#   ln -s /etc/nginx/sites-available/mtpl.conf /etc/nginx/sites-enabled/mtpl.conf
#
# NOTE: Do NOT enable the HTTPS (443) server blocks until DNS points to the VPS
#       and Certbot has issued certificates. Follow docs/deploy/NGINX_SSL_RUNBOOK.md.
# ==============================================================================

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Upgrade to HTTPS preserving original $host (no cross-domain redirect)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mishrikotkartravels.com www.mishrikotkartravels.com mtpl.online www.mtpl.online;

    # Allow Let's Encrypt ACME HTTP-01 challenge validation & auto-renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — Domain 1: mishrikotkartravels.com & www.mishrikotkartravels.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mishrikotkartravels.com www.mishrikotkartravels.com;

    ssl_certificate     /etc/letsencrypt/live/mishrikotkartravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishrikotkartravels.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/mtpl-proxy.conf;
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — Domain 2: mtpl.online & www.mtpl.online
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mtpl.online www.mtpl.online;

    ssl_certificate     /etc/letsencrypt/live/mtpl.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtpl.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/mtpl-proxy.conf;
}

